# =============================================================================
# 国家电网电力传感器（持久化）
# 按 ARC-MX/sgcc_electricity_new README 的 trigger-based template 方案配置。
# state_class 已适配当前 Home Assistant：电量/金额使用 total，年度累计电量使用 total_increasing。
# =============================================================================

template:

  # 大姜充电（户号后缀 1051）
  - trigger:
      - platform: event
        event_type: state_changed
        event_data:
          entity_id: sensor.electricity_charge_balance_1051
    sensor:
      - name: electricity_charge_balance_1051
        unique_id: electricity_charge_balance_1051
        state: "{{ states('sensor.electricity_charge_balance_1051') }}"
        state_class: total
        unit_of_measurement: "CNY"
        device_class: monetary
  - trigger:
      - platform: event
        event_type: state_changed
        event_data:
          entity_id: sensor.last_electricity_usage_1051
    sensor:

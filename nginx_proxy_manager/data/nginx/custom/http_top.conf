# Preserve the externally visible non-standard HTTPS port for ESPHome.
# ESPHome's Tornado WebSocket handler requires Origin and Host to match.
map $host $npm_upstream_host {
    default                       $host;
    esphome.xuchengcat.cn         $http_host;
    esphome.speedtest.xuchengcat.cn $http_host;
    nextcloud.speedtest.xuchengcat.cn $http_host;
    nextcloud.xuchengcat.cn       $http_host;
}

# Host port 444 maps to container TLS port 443. HTTP entry remains host 81.
map $scheme $npm_external_port {
    default 81;
    https 444;
}

# OpenClaw accepts client attribution only from this edge, never caller-supplied XFF.
map $host $npm_client_forwarded_for {
    default $proxy_add_x_forwarded_for;
    openclaw.xuchengcat.cn $remote_addr;
    openclaw.speedtest.xuchengcat.cn $remote_addr;
}

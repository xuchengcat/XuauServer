# Homepage serves custom.css and custom.js from dynamic configuration endpoints.
# Do not let Nginx Proxy Manager's generic *.css/*.js asset rule cache them.
location = /api/config/custom.css {
    proxy_cache off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    include conf.d/include/proxy.conf;
}

location = /api/config/custom.js {
    proxy_cache off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    include conf.d/include/proxy.conf;
}

# DESIGN CANDIDATE ONLY: replaces the existing Netplan file after coordinated switch changes.
# No fixed public prefix here; DHCPv6-PD owns br_ent global IPv6 addresses.
network:
  version: 2
  renderer: networkd
  ethernets:
    LAN_1G:
      macaddress: 24:CF:24:1A:D5:EB
      dhcp4: false
      dhcp6: false
      optional: true
      accept-ra: false
    LAN_2.5G_1:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      optional: true
      link-local: []
    LAN_2.5G_2:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      optional: true
      link-local: []
  bridges:
    br_lan:
      interfaces:
      - vlan2
      - LAN_2.5G_2
      addresses:
      - 192.168.2.1/24
      - fc00:192:168:2::100/64
      dhcp4: false
      dhcp6: false
      accept-ra: false
      parameters:
        stp: true
        forward-delay: 4
      optional: true
      macaddress: 6a:b9:69:50:50:af
    br_ent:
      interfaces:
      - vlan20
      addresses:
      - 192.168.20.1/24
      macaddress: 02:20:00:00:00:01
      dhcp4: false
      dhcp6: false
      accept-ra: false
      parameters:
        stp: true
        forward-delay: 4
      optional: true
  vlans:
    vlan_ppp:
      id: 36
      link: LAN_1G
      dhcp4: false
      dhcp6: false
      optional: true
      accept-ra: false
    vlan2:
      id: 2
      link: LAN_2.5G_1
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
      optional: true
    vlan20:
      id: 20
      link: LAN_2.5G_1
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
      optional: true

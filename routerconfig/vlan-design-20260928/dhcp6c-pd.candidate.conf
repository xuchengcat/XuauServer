# DESIGN CANDIDATE ONLY. Never run concurrently with another WAN DHCPv6 client.
# Based on a /62 ADVERTISE, not a committed lease. Confirm the actual length.
interface pppoe_dial {
    send ia-pd 1;
};
id-assoc pd 1 {
    prefix-interface br_ent {
        sla-id 0;
        sla-len 2;
        ifid 1;
    };
};
# SLA length = 64 minus delegated prefix length; /62 -> 2.
# No DNS update script, no information-only, no fixed public prefix.

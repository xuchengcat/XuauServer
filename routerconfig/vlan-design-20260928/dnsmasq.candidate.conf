# DESIGN CANDIDATE ONLY: replace existing DHCP config, do not load alongside it.
# Both DNS/DHCP/RA LAN interfaces. No DHCP service on the raw trunk or WAN.
interface=br_lan
interface=br_ent

# VLAN 2: existing non-public-IPv6 segment.
dhcp-range=set:iot4,192.168.2.101,192.168.2.254,255.255.255.0,24h
dhcp-option=tag:iot4,option:router,192.168.2.1
dhcp-option=tag:iot4,option:dns-server,192.168.2.1
dhcp-range=set:iot6,fc00:192:168:2::2,fc00:192:168:2::ff,64,24h
dhcp-range=set:iot6,fc00:192:168:2::,slaac,64,24h
dhcp-option=tag:br_lan,option6:dns-server,[fc00:192:168:2::100]

# VLAN 20: entertainment clients. Public /64 is created by the PD client.
dhcp-range=set:ent4,192.168.20.101,192.168.20.254,255.255.255.0,24h
dhcp-option=tag:ent4,option:router,192.168.20.1
dhcp-option=tag:ent4,option:dns-server,192.168.20.1
dhcp-range=set:ent6,::,constructor:br_ent,ra-stateless,64,1h
# [fe80::] is dnsmasq's placeholder for its link-local DNS address.
dhcp-option=tag:br_ent,option6:dns-server,[fe80::]
# Current WAN MTU is 1440. Review if PPPoE MTU is deliberately changed later.
ra-param=br_ent,mtu:1440,60,180

# NTP options omitted: no local UDP/123 listener was observed.
# Reservations below are proposed; device roles must be checked before deployment.
dhcp-host=D8:43:AE:9D:74:D5,XuchengGame,192.168.20.2,infinite
dhcp-host=1A:5E:24:12:1c:9d,Exchange25G,192.168.2.10,[fc00:192:168:2::10],infinite
dhcp-host=40:EC:99:96:14:05,HanDeskTop,192.168.20.11,infinite
dhcp-host=58:95:D8:1A:83:1A,UnWifi     ,192.168.2.30,[fc00:192:168:2::30],infinite
dhcp-host=00:12:34:6B:C5:49,Cameraroom  ,192.168.2.90,[fc00:192:168:2::90],infinite
dhcp-host=E0:62:90:88:6B:59,Camera404  ,192.168.2.99,[fc00:192:168:2::99],infinite

port=53
resolv-file=/etc/resolv.conf
cache-size=15000
address=/xuchengcat.cn/192.168.2.1
enable-ra
dhcp-authoritative
log-facility=/var/log/dnsmasq/dnsmasq.log   # logfile path.
log-async=25
log-queries # log queries.
log-dhcp    # log dhcp related messages.

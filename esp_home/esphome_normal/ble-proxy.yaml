esphome:
  name: ble-proxy
  friendly_name: BLE_PROXY

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret ble_proxy_api_encryption_key

ota:
  - platform: esphome
    password: !secret ble_proxy_ota_password

wifi:
  power_save_mode: none
  ssid: !secret hallway_wifi_ssid
  password: !secret hallway_wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Ble-Proxy Fallback Hotspot"
    password: !secret ble_proxy_fallback_password

captive_portal:

esp32_ble_tracker:

bluetooth_proxy:
  active: true
